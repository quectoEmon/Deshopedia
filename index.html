<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Hind+Siliguri:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: green hero with the district picker, sticky pill tabs, then one page per tab; places and institutions are slide decks. */
:root {
  --bg: #f1f5f2;
  --surface: #ffffff;
  --surface-2: #e4ece7;
  --fg: #10231c;
  --muted: #4e6159;
  --line: #d0dcd5;
  --accent: #00573f;
  --accent-ink: #ffffff;
  --red: #d92c45;
  --good: #1f7a3e;
  --warn: #9a5b00;
  --crit: #b3261e;
  --hero: #0b3d2e;
  --hero-ink: #f1f6f3;
  --hero-muted: #a9c7ba;
  --tn1: #d9ebe3;
  --tn2: #d8e6f2;
  --tn3: #f3e7cc;
  --tn4: #e7ddf0;
  --tn5: #f5dadd;
  --font-display: "Sora", "Hind Siliguri", system-ui, sans-serif;
  --font-body: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #0e1110; --surface-2: #1a1f1d; --fg: #ecf2ef; --muted: #a2b0aa; --line: #2a3330;
    --accent: #4cc9a5; --accent-ink: #05211a; --red: #ff6b7d; --good: #6cd08c; --warn: #e0a33a; --crit: #ff8a80;
    --hero: #030a07; --hero-ink: #f1f6f3; --hero-muted: #a9c7ba;
    --tn1: #0f2a22; --tn2: #11202e; --tn3: #2b2312; --tn4: #231a2b; --tn5: #2b1a1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #0e1110; --surface-2: #1a1f1d; --fg: #ecf2ef; --muted: #a2b0aa; --line: #2a3330;
  --accent: #4cc9a5; --accent-ink: #05211a; --red: #ff6b7d; --good: #6cd08c; --warn: #e0a33a; --crit: #ff8a80;
  --hero: #030a07; --hero-ink: #f1f6f3; --hero-muted: #a9c7ba;
  --tn1: #0f2a22; --tn2: #11202e; --tn3: #2b2312; --tn4: #231a2b; --tn5: #2b1a1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-bottom: 48px; }
.wrap { max-width: 1112px; margin-inline: auto; padding-inline: 16px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .vp:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
select, input, textarea, button { font: inherit; color: inherit; }

/* hero */
.hero { position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink); padding-block: 38px 42px; }
.hero::after { content: ""; position: absolute; right: -90px; top: 50%; width: min(46vw, 420px); aspect-ratio: 1; border-radius: 50%; background: var(--red); transform: translateY(-50%); opacity: 0.95; }
.hero .wrap { position: relative; z-index: 1; display: grid; gap: 16px; }
.eyebrow { margin: 0; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--hero-muted); }
.eyebrow::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 10px; }
.hero h1 { font-size: clamp(2.6rem, 8vw, 4.6rem); font-weight: 700; line-height: 1; }
.hero .sub { margin: 0; font-size: 1.1rem; color: var(--hero-muted); max-width: 40ch; }
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 8px; }
.picker label { font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--hero-muted); }
#district { min-width: min(100%, 300px); font-weight: 600; background: var(--surface); color: var(--fg); border: 0; border-radius: 12px; padding: 12px 14px; }
.pill { font-size: 0.8rem; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.hero .pill { background: rgba(255, 255, 255, 0.16); color: var(--hero-ink); }

/* tabs */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: transparent; border: 1px solid transparent; border-radius: 99px; padding: 8px 16px; cursor: pointer; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--fg); border-color: var(--line); }
.tab[aria-selected=true], .tab[aria-selected=true]:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.view { padding-block: 28px 4px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 16px; }
.sec-head h2 { font-size: clamp(1.5rem, 3.5vw, 2rem); font-weight: 700; }
.sec-head span { color: var(--muted); font-size: 0.92rem; }

/* overview */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; min-width: 0; }
.tile .k { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--font-num); font-size: 2.5rem; margin-block: 6px 2px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .v small { font-size: 0.95rem; color: var(--muted); }
.tile .s { font-weight: 600; font-size: 0.92rem; }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.ok { color: var(--good); } .mid { color: var(--warn); } .bad { color: var(--crit); }
.meter i.ok { background: var(--good); } .meter i.mid { background: var(--warn); } .meter i.bad { background: var(--crit); }
.jump { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 22px; }
.jump button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; cursor: pointer; }
.jump button:hover { border-color: var(--accent); }
.jump b { display: block; font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; }
.jump span { color: var(--muted); font-size: 0.9rem; }

/* panels and lists */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; min-width: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.nums { list-style: none; margin: 0; padding: 0; }
.nums li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.nums li:last-child { border-bottom: 0; }
.nums .n { font-family: var(--font-num); font-size: 1.15rem; min-width: 5.2em; font-variant-numeric: tabular-nums; user-select: all; }
.nums .t { flex: 1 1 140px; min-width: 0; }
.nums .t b { display: block; font-weight: 600; }
.nums .t span { color: var(--muted); font-size: 0.85rem; }
.nums li.big .n { color: var(--crit); font-size: 1.6rem; }
.btn { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 0.9rem; font-weight: 500; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 10px 18px; font-size: 0.95rem; }

/* slide decks */
.deck { display: grid; gap: 14px; }
.vp { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; border-radius: 22px; border: 1px solid var(--line); }
.vp::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; padding: clamp(22px, 4vw, 40px); display: flex; flex-direction: column; gap: 16px; min-height: 340px; }
.tone1 { background: var(--tn1); } .tone2 { background: var(--tn2); } .tone3 { background: var(--tn3); } .tone4 { background: var(--tn4); } .tone5 { background: var(--tn5); }
.slide .kicker { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--muted); }
.slide .kicker::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 10px; }
.slide h3 { font-size: clamp(1.6rem, 4.5vw, 2.5rem); font-weight: 700; line-height: 1.08; }
.slide .intro { margin: 0; font-size: 1.08rem; max-width: 58ch; flex: 1; }
.slide .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.slide .actions .btn:not(.primary) { background: var(--surface); }
.slide .note { margin: 0; }
.dk-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.dk-ctl .count { font-family: var(--font-num); font-size: 0.9rem; color: var(--muted); min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.dots button { width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
.dots button[aria-current=true] { background: var(--accent); }

/* forms */
.travel { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-bottom: 16px; }
.travel .field { flex: 1 1 220px; }
.travel .field.small { flex: 0 1 170px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
select, input[type=text], input[type=number], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.field select, .field input, textarea { width: 100%; }
form.grid { display: grid; gap: 14px; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
textarea { min-height: 88px; resize: vertical; }
.result { margin-top: 16px; display: grid; gap: 12px; }
.fert { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fert div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.fert b { display: block; font-family: var(--font-num); font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.fert span { color: var(--muted); font-size: 0.82rem; }
.note { color: var(--muted); font-size: 0.85rem; margin: 0; }
.reports { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; }
.reports li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.reports li b { font-weight: 600; }
.reports li small { color: var(--muted); display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.9rem; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.zones { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.zones li { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; border-left: 6px solid var(--c); }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

/* chat */
.chat { display: grid; gap: 12px; }
.log { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 10px 14px; border-radius: 16px; min-width: 0; overflow-wrap: anywhere; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
.msg.bot { background: var(--surface-2); align-self: flex-start; }
.msg.me { background: var(--accent); color: var(--accent-ink); align-self: flex-end; }
.msg a { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; }

/* about */
.about-text { max-width: 60ch; margin: 0 0 22px; font-size: 1.08rem; }
.team { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.member { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px 18px; text-align: center; display: grid; justify-items: center; gap: 6px; min-width: 0; }
.member h3 { font-size: 1.3rem; font-weight: 700; margin-top: 12px; }
.member .sid { margin: 0; font-family: var(--font-num); font-size: 0.95rem; color: var(--muted); }
.member .role { margin: 6px 0 0; font-size: 0.82rem; font-weight: 600; padding: 4px 14px; border-radius: 99px; background: var(--surface-2); color: var(--accent); }
.ph { position: relative; width: 132px; height: 132px; border-radius: 50%; overflow: hidden; background: var(--tn1); color: var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; box-shadow: 0 0 0 5px var(--surface-2); }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }


.themebtn { border: 0; cursor: pointer; font: inherit; font-size: 0.8rem; font-weight: 600; }
.themebtn:hover { background: rgba(255, 255, 255, 0.28); }
.purpose { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 30px; }
.purpose h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
.purpose p { margin: 0; color: var(--muted); }
.purpose ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--muted); }
.team-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 14px; }
footer { margin-top: 36px; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--line); padding-top: 16px; }
@media (max-width: 640px) {
  .hero::after { opacity: 0.4; right: -200px; top: 78%; }
  .ask { flex-wrap: wrap; }
  .dots { margin-left: 0; }
}

/* Glassy Bangladesh theme */
:root {
  --bg: #e8f5e9;
  --surface: rgba(255,255,255,.58);
  --surface-2: rgba(220,244,226,.60);
  --fg: #103c2c;
  --muted: #4d7160;
  --line: rgba(30,105,66,.20);
  --accent: #087c45;
  --accent-ink: #fff;
  --red: #e52b45;
  --hero: rgba(7,75,47,.60);
  --hero-ink: #f3fff6;
  --hero-muted: #c8e9d3;
}
body {
  position: relative;
  isolation: isolate;
  background: linear-gradient(135deg,#edf9e9 0%,#d7f0df 45%,#eff8e9 100%);
}
.map-backdrop {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  display: grid; place-items: center; overflow: hidden;
}
.map-backdrop img {
  width: min(78vw, 880px); height: 120vh; object-fit: contain;
  opacity: .14; filter: saturate(1.12); transform: rotate(-3deg);
}
.hero {
  background: rgba(4, 75, 46, .58);
  border-bottom: 1px solid rgba(255,255,255,.25);
  backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
}
.hero::after { display:none; }
.hero .wrap { gap: 14px; }
.brand-row { display:flex; align-items:center; justify-content:space-between; gap:20px; }
.brand-row h1 { font-size:clamp(2.2rem,7vw,4.4rem); }
.brand-row h1 span { color:#d8ffe4; }
.brand-map {
  width: clamp(86px, 15vw, 175px); height: clamp(105px, 18vw, 205px);
  object-fit: contain; filter: drop-shadow(0 12px 18px rgba(0,0,0,.18));
  flex: 0 0 auto;
}
.tile, .panel, .jump button, .member, .vp, .log, .tabbar, .travel input, .travel select,
#district, .reports li {
  background: rgba(255,255,255,.50);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: 0 8px 30px rgba(13,82,48,.08), inset 0 1px 0 rgba(255,255,255,.7);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.tabbar { background:rgba(239,250,239,.55); }
.tab[aria-selected=true], .tab[aria-selected=true]:hover { background:rgba(5,112,64,.86); }
.pill { background:rgba(255,255,255,.25); }
.hero .pill { background:rgba(255,255,255,.17); }
.slide { background:rgba(255,255,255,.43); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.tone1,.tone2,.tone3,.tone4,.tone5 { background:rgba(255,255,255,.40); }
.btn { background:rgba(255,255,255,.48); border-color:rgba(255,255,255,.8); backdrop-filter:blur(12px); }
.btn.primary { background:rgba(5,116,64,.88); }
footer { border-color:rgba(16,92,53,.22); }
@media (max-width:640px) {
 .brand-row { gap:8px; }
 .brand-row h1 { font-size:clamp(2rem,10vw,3.2rem); }
 .brand-map { width:90px; height:120px; }
 .map-backdrop img { width:120vw; height:100vh; opacity:.10; }
}


/* Forest-green glass refinement */
:root {
  --bg: #062b1b;
  --surface: rgba(13, 67, 42, .72);
  --surface-2: rgba(22, 91, 54, .62);
  --fg: #effff2;
  --muted: #b6d7c0;
  --line: rgba(175, 231, 190, .20);
  --accent: #39a866;
  --accent-ink: #f5fff7;
  --red: #ed2948;
  --hero: rgba(3, 44, 27, .78);
  --hero-ink: #f3fff6;
  --hero-muted: #c1e6cb;
  --tn1: rgba(20, 92, 55, .60);
  --tn2: rgba(17, 79, 49, .60);
  --tn3: rgba(35, 105, 61, .55);
  --tn4: rgba(15, 72, 43, .60);
  --tn5: rgba(91, 35, 43, .45);
  color-scheme: dark;
}
body {
  background: radial-gradient(ellipse at 15% 0%, #145b35 0%, #082f1e 42%, #031b11 100%);
  color: var(--fg);
}
.map-backdrop img {
  width: min(86vw, 1040px);
  height: 125vh;
  opacity: .19;
  filter: saturate(1.25) brightness(.78);
}
.hero {
  background: rgba(3, 45, 27, .72);
  border-bottom: 1px solid rgba(178, 237, 192, .20);
}
.brand-row { align-items: center; }
.brand-map {
  width: clamp(190px, 29vw, 360px);
  height: clamp(220px, 32vw, 390px);
  object-fit: contain;
  filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .38));
}
.tile, .panel, .jump button, .member, .vp, .log, .tabbar, .travel input, .travel select,
#district, .reports li {
  background: rgba(8, 57, 35, .70);
  border-color: rgba(178, 237, 192, .18);
  box-shadow: 0 10px 34px rgba(0, 0, 0, .18), inset 0 1px 0 rgba(223, 255, 230, .10);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.tabbar { background: rgba(3, 37, 23, .78); }
.tab[aria-selected=true], .tab[aria-selected=true]:hover,
.btn.primary { background: rgba(40, 151, 79, .92); border-color: rgba(137, 232, 157, .35); }
.tab { color: #c0ddc8; }
.tab:hover { color: #fff; }
.pill { color: #e2f8e7; background: rgba(125, 198, 142, .18); }
.slide { background: rgba(9, 61, 37, .68); border-color: rgba(178, 237, 192, .18); }
.tone1,.tone2,.tone3,.tone4,.tone5 { background: rgba(15, 79, 47, .60); }
.btn { background: rgba(22, 87, 51, .65); border-color: rgba(178, 237, 192, .25); color: #f1fff4; }
select, input[type=text], input[type=number], textarea { background: rgba(5, 46, 28, .85); color: #effff2; border-color: rgba(178, 237, 192, .25); }
footer { border-color: rgba(178, 237, 192, .22); }
@media (max-width: 640px) {
  .brand-row { gap: 4px; }
  .brand-row h1 { font-size: clamp(1.8rem, 8vw, 2.8rem); }
  .brand-map { width: clamp(135px, 38vw, 190px); height: clamp(175px, 46vw, 230px); }
  .map-backdrop img { width: 135vw; height: 100vh; opacity: .12; }
}



/* Forest green + soft rose-red accents; enlarged, close header map */
:root {
  --red: #ff8f9f;
  --accent: #e96b7d;
  --accent-ink: #fff8f8;
}
.brand-row {
  justify-content: flex-start;
  gap: 0;
}
.brand-row h1 {
  flex: 0 0 auto;
  position: relative;
  z-index: 1;
}
.brand-row h1 span { color: #ffb1bb; }
.brand-map {
  width: clamp(280px, 39vw, 500px);
  height: clamp(320px, 43vw, 530px);
  margin-left: -18px;
  object-position: center;
  filter: drop-shadow(0 18px 32px rgba(0,0,0,.38)) drop-shadow(0 0 12px rgba(255,143,159,.14));
}
.tile, .panel, .jump button, .member, .vp, .
